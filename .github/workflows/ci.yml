name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (SQLite)
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack src/Payments.Outbox.EntityFrameworkCore/Payments.Outbox.EntityFrameworkCore.csproj -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.nupkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ./coverage

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outbox
          POSTGRES_PASSWORD: outbox
          POSTGRES_DB: outbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OUTBOX_PG: Host=localhost;Port=5432;Username=outbox;Password=outbox;Database=outbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (PostgreSQL integration)
        run: >
          dotnet test -c Release --no-build
          --filter "Category=Postgres"
          --logger "trx;LogFileName=postgres.trx"
          --results-directory ./postgres-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-results
          path: ./postgres-results
